<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/js/script.js"></script>
</head>
<body>
    <!-- 전체 컨테이너 -->
    <div id="container">

        <!-- 제목부분 -->
        <h1 id="title"><a href="/">메인 화면</a></h1>

        <!-- 네비게이션 -->
        <ul id="nav">
            <li><a href="/student">학생 등록</a></li>
            <li><a href="/score">점수 등록</a></li>
            <li><a href="/list">점수 조회</a></li>
        </ul>

        <!-- 서브타이틀 -->
        <h2 id="sub-title">시험점수 등록</h2>
        
        <h2>학생 목록 (점수 등록할 학생을 선택하세요)</h2>

        <!-- 디비에서 가져온 학생정보 뿌릴 공간 -->
        <div id="studentList"></div>

        <!-- 선택한 학생 id를 저장할 input -->
        <input type="hidden" id="selectedStudentId">

        <div id="form">
            <div>
                국어점수: <input type="text" id="korean" placeholder="0~100">
            </div>
            <div>
                영어점수: <input type="text" id="english" placeholder="0~100">
            </div>
            <div>
                수학점수: <input type="text" id="math" placeholder="0~100">
            </div>
            <button type="button" id="scoreBtn">등록</button>
        </div>
    </div>
    
</body>
</html>
