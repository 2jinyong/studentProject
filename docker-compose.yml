services:
  # 1. DB 서비스
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always # 컨테이너가 꺼져도 계속 다시 실행
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql # 데이터 영구 저장

  # 2. 백엔드 서비스
  backend:
    build:
      context: ./backend # 이 경로의 Dockerfile을 찾아 빌드함
    container_name: spring_app
    ports:
      - "8080:8080"
    environment:
      # 컨테이너끼리는 서비스명(db)으로 통신함
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/student_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - db # DB가 먼저 뜬 다음에 백엔드 실행

  # 3. 프론트엔드 서비스
  frontend:
    build:
      context: ./front
    container_name: node_app
    ports:
      - "3000:3000"
    depends_on: # 백엔드 실행 이후 실행
      - backend

# 공용 데이터 저장소 설정 도커가 자동으로 관리
volumes:
  mysql_data: